<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pendaftaran Akun</title>
  </head>
  <body>

    <nav>
      <a href="index.html">IMDb Top 3 Movies</a> |
      <a href="blog.html">Dev Blogs</a> |
      <a href="blog-detail.html">Blog Detail</a> |

    <main>

      <hr>

      <h1>Form Pendaftaran Akun</h1>

      <form action="#" method="post">
        <fieldset>
          <legend>Daftar Akun</legend>

          <p>
            <label for="nama_lengkap">Nama Lengkap:</label>
            <input type="text" name="nama_lengkap" id="nama_lengkap">
          </p>

          <hr>

          <p>Jenis Kelamin:
            <input type="radio" name="jenis_kelamin" value="Laki-Laki" id="lk"> <label for="lk">Laki-Laki</label>
            <input type="radio" name="jenis_kelamin" value="Perempuan" id="pr"> <label for="pr">Perempuan</label>
          </p>

          <hr>

          <p>
            <label for="tempat_lahir">Tempat Lahir:</label>
            <input type="text" name="tempat_lahir" id="tempat_lahir">
          </p>

          <hr>

          <p>
            <label for="tanggal_lahir">Tanggal Lahir:</label>
            <input type="date" name="tanggal_lahir" id="tanggal_lahir">
          </p>

          <hr>

          <p>
            <label for="agama">Agama:</label>
            <select name="agama" id="agama">
              <option value="">--- Pilih Agama ---</option>
              <option value="Islam">Islam</option>
              <option value="Katolik">Katolik</option>
              <option value="Protestan">Protestan</option>
              <option value="Hindu">Hindu</option>
              <option value="Buddha">Buddha</option>
              <option value="Konghucu">Konghucu</option>
            </select>
          </p>

          <hr>

          <p>Hobi:
            <input type="checkbox" name="hobi[]" value="Olahraga" id="hobi1"> <label for="hobi1">Olahraga</label>
            <input type="checkbox" name="hobi[]" value="Membaca" id="hobi2"> <label for="hobi2">Membaca</label>
            <input type="checkbox" name="hobi[]" value="Ngoding" id="hobi3"> <label for="hobi3">Ngoding</label>
          </p>

          <hr>

          <p>
            <label for="password">Password:</label>
            <input type="password" name="password" id="password">
          </p>

          <hr>

          <p>
            <input type="checkbox" name="persetujuan" id="setuju">
            <label for="setuju">Dengan mendaftar saya setuju dengan Ketentuan dan Kebijakan Privasi Aplikasi.</label>
          </p>

          <p>
            <input type="reset" value="Reset">
            <input type="submit" value="Submit">
          </p>

        </fieldset>
      </form>

    </main>

  </body>
</html>
